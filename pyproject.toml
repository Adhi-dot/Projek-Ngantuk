[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mabaops"
version = "0.1.0"
description = "Local-first student life operating system for Indonesian college freshmen."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Adhi" }
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]
web = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0"
]

[project.scripts]
mabaops = "mabaops.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
